<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Feast</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ee;--fg:#2b2118;--mut:#d8ccbb;--card:#fff;--ac:#e53935}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--fg:#f3ece2;--mut:#4a443c;--card:#2a2621}}
:root[data-theme="dark"]{--bg:#1d1a16;--fg:#f3ece2;--mut:#4a443c;--card:#2a2621}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:10px;touch-action:manipulation;user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--card);border:1px solid var(--mut);border-radius:10px;padding:6px 12px}
.screen{display:none;flex-direction:column;align-items:center;gap:12px}.screen.on{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(92vw,380px);font-weight:600}
#home{justify-content:center;min-height:85vh;gap:14px}
.logo{font-size:26px;font-weight:800}.chip{font-size:20px;font-weight:600}
.big{font-size:104px;font-weight:800;line-height:1}.sub{opacity:.7}
.play{background:var(--ac);color:#fff;border:0;border-radius:16px;padding:14px 48px;font-size:22px;font-weight:700}
.card{display:flex;align-items:center;gap:12px;width:min(92vw,380px);padding:12px;background:var(--card);border:1px solid var(--mut);border-radius:14px;text-align:left}
.card.soon{opacity:.45}.em{font-size:30px}.ct{flex:1;display:flex;flex-direction:column;gap:6px}
.ct i{display:block;height:6px;border-radius:3px;background:var(--mut);overflow:hidden}.ct u{display:block;height:100%;background:#4caf50}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(92vw,380px)}
.lv{aspect-ratio:1;border-radius:12px;border:1px solid var(--mut);background:var(--card);font-weight:700}
.lv.done{background:#4caf50;color:#fff;border:0}.lv.cur{background:var(--ac);color:#fff;border:0}.lv.lock{opacity:.35;cursor:default}
.hint{font-size:13px;opacity:.75;width:min(92vw,380px);text-align:center}
#board{display:grid;gap:1px;width:min(78vw,340px);margin:24px 0;background:var(--mut);padding:1px;border-radius:6px}
#board div{aspect-ratio:1;background:var(--bg)}#board div.on{transition:background .15s}
#slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(92vw,380px)}
.slot{width:52px;height:44px;border:2px dashed var(--mut);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
#cols{display:flex;gap:10px;align-items:flex-start;justify-content:center}
.col{display:flex;flex-direction:column;gap:6px;align-items:center}
.tile{width:56px;height:44px;border:0;border-radius:10px;font-weight:700;font-size:17px;color:#fff;text-shadow:0 0 3px #000}
.tile.lock{background:var(--mut)!important;color:var(--fg);text-shadow:none;cursor:default;opacity:.7}
.more{font-size:12px;opacity:.6}
#ants{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5}
.ant{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid #222;box-sizing:border-box}
.ant::after{content:'';position:absolute;left:3px;top:-6px;width:6px;height:6px;border-radius:50%;background:#222}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
#ov .box{background:var(--card);border-radius:16px;padding:22px 26px;text-align:center;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div id="home" class="screen on">
  <div class="logo">🐜 Ant Feast</div>
  <div class="chip" id="hcat"></div>
  <div class="big" id="hnum"></div>
  <div class="sub" id="hsub"></div>
  <button class="play" id="play">▶ Грати</button>
  <button class="btn" id="tocat">📚 Каталог</button>
</div>
<div id="catalog" class="screen">
  <div class="bar"><button class="btn" id="b1">←</button><span>Каталог</span><span></span></div>
  <div id="cats" class="screen on" style="gap:10px"></div>
</div>
<div id="catpage" class="screen">
  <div class="bar"><button class="btn" id="b2">←</button><span id="cpt"></span><span></span></div>
  <div id="lvls" class="lgrid"></div>
</div>
<div id="game" class="screen">
  <div class="bar"><button class="btn" id="gback">←</button><span id="title"></span><button class="btn" id="restart">↻</button></div>
  <div class="hint">Тапай плитку зверху колонки. Мурахи йдуть до пікселів її кольору. Їсти можна лише ті, що з краю картинки або поруч із порожнім місцем.</div>
  <div id="board"></div><div id="slots"></div><div id="cols"></div>
</div>
<div id="ants"></div>
<div id="ov"><div class="box"><div id="msg" style="font-size:20px;font-weight:700"></div><div id="sub2"></div><button class="btn" id="act"></button><button class="btn" id="act2">Меню</button></div></div>

<script>
const $=id=>document.getElementById(id),N4=[[1,0],[-1,0],[0,1],[0,-1]];
const DIFF={easy:{type:'легкий',slots:6,cols:3,min:2,max:5},mid:{type:'середній',slots:5,cols:4,min:2,max:6},hard:{type:'ХАРД',slots:3,cols:5,min:3,max:8}};
let CATS=[],CACHE={},PROG={cat:null,done:{}},CUR={},S,cat,idx=0,cellEls=[],slotEls=[];
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand()}catch(e){}}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---- прогрес (хмара Telegram або localStorage) ----
const useTg=()=>tg&&tg.initData&&tg.CloudStorage;
function saveProg(){const v=JSON.stringify(PROG);try{useTg()?tg.CloudStorage.setItem('prog',v):localStorage.setItem('prog',v)}catch(e){}}
function loadProg(){return new Promise(res=>{const f=v=>{try{if(v)PROG=JSON.parse(v)}catch(e){}res()};
  try{useTg()?tg.CloudStorage.getItem('prog',(e,v)=>f(v)):f(localStorage.getItem('prog'))}catch(e){res()}})}

// ---- логіка гри ----
// Піксель доступний, якщо він на краю картинки або поруч із порожнім місцем (з будь-якого боку)
function acc(g,x,y){return !!g[y][x]&&N4.some(([dx,dy])=>{const a=x+dx,b=y+dy;return a<0||b<0||a>=g[0].length||b>=g.length||!g[b][a]})}
// Генератор: симулюємо реальну партію, тому рівень гарантовано розв'язний
function build(L){
  const r=rng(L.seed),map=L.map,H=map.length,W=map[0].length;
  const g=map.map(s=>[...s].map(ch=>ch==='.'?null:ch));
  let left=g.flat().filter(Boolean).length;
  const total=left,seq=[],f=Math.max(1,total/250),mn=Math.round(L.min*f),mx=Math.round(L.max*f);
  while(left>0){
    const cells=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(acc(g,x,y))cells.push([x,y]);
    const cs=[...new Set(cells.map(([x,y])=>g[y][x]))],c=cs[Math.floor(r()*cs.length)];
    const mine=cells.filter(([x,y])=>g[y][x]===c).sort(()=>r()-.5);
    const k=Math.min(mine.length,mn+Math.floor(r()*(mx-mn+1)));
    for(let i=0;i<k;i++)g[mine[i][1]][mine[i][0]]=null;
    seq.push({c,n:k});left-=k;
  }
  const cols=Array.from({length:L.cols},()=>[]);
  seq.forEach(t=>cols[Math.floor(r()*L.cols)].push(t));
  return{W,H,cols,total,g:map.map(s=>[...s].map(ch=>ch==='.'?null:ch))};
}
function startGame(L){
  const b=build(L);CUR=L.pal;
  S={g:b.g,W:b.W,H:b.H,cols:b.cols,slots:Array(L.slots).fill(null),res:new Set(),ants:0,left:b.total,over:false};
  $('title').textContent=`${cat.emoji} ${idx+1}/${cat.levels.length} · ${L.type}`;
  $('ov').style.display='none';$('ants').innerHTML='';
  const bd=$('board');bd.innerHTML='';bd.style.gridTemplateColumns=`repeat(${S.W},1fr)`;cellEls=[];
  for(let y=0;y<S.H;y++)for(let x=0;x<S.W;x++){const d=document.createElement('div'),c=S.g[y][x];if(c){d.style.background=CUR[c];d.className='on'}cellEls.push(d);bd.appendChild(d)}
  const sl=$('slots');sl.innerHTML='';slotEls=[];
  for(let k=0;k<L.slots;k++){const d=document.createElement('div');d.className='slot';slotEls.push(d);sl.appendChild(d)}
  renderCols();renderSlots();
}
function renderCols(){
  const el=$('cols');el.innerHTML='';
  S.cols.forEach((col,ci)=>{
    const d=document.createElement('div');d.className='col';
    col.slice(0,3).forEach((t,k)=>{const b=document.createElement('button');b.className='tile'+(k?' lock':'');
      b.textContent=k?'?':t.n;if(!k){b.style.background=CUR[t.c];b.onclick=()=>tap(ci)}d.appendChild(b)});
    if(col.length>3){const m=document.createElement('div');m.className='more';m.textContent='+'+(col.length-3);d.appendChild(m)}
    el.appendChild(d)});
}
function renderSlots(){S.slots.forEach((t,i)=>{const e=slotEls[i];e.style.background=t?CUR[t.c]:'transparent';e.style.borderStyle=t?'solid':'dashed';e.textContent=t?t.n:''})}
function tap(ci){
  if(S.over)return;const col=S.cols[ci];if(!col.length)return;
  const si=S.slots.indexOf(null);if(si<0)return;
  S.slots[si]=col.shift();renderCols();renderSlots();dispatch();
}
function dispatch(){
  S.slots.forEach((t,i)=>{
    if(!t||t.n<=0)return;
    const list=[];
    for(let y=0;y<S.H;y++)for(let x=0;x<S.W;x++)if(S.g[y][x]===t.c&&!S.res.has(y*S.W+x)&&acc(S.g,x,y))list.push([x,y]);
    const k=Math.min(t.n,list.length);
    for(let j=0;j<k;j++)sendAnt(i,list[j],j,t.c);
    t.n-=k;if(t.n<=0)S.slots[i]=null;
  });
  renderSlots();check();
}
// Мураха ходить по порожніх клітинках і навколо картинки до клітинки поруч зі своїм пікселем (з будь-якого боку)
function route(cx,tx,ty){
  const W=S.W,H=S.H,id=(x,y)=>(y+1)*(W+2)+(x+1),free=(x,y)=>x<0||y<0||x>=W||y>=H||!S.g[y][x];
  const prev=new Map(),q=[[cx,H]];prev.set(id(cx,H),null);
  while(q.length){const [x,y]=q.shift();
    if(Math.abs(x-tx)+Math.abs(y-ty)===1){const out=[];let c=[x,y];while(c){out.push(c);c=prev.get(id(c[0],c[1]))}return out.reverse()}
    for(const [dx,dy] of N4){const a=x+dx,b=y+dy;if(a<-1||b<-1||a>W||b>H||prev.has(id(a,b))||!free(a,b))continue;prev.set(id(a,b),[x,y]);q.push([a,b])}}
  return null;
}
const SPEED=0.17; // px за мс: менше = повільніше
function sendAnt(si,[x,y],j,c){
  S.res.add(y*S.W+x);S.ants++;
  const a=slotEls[si].getBoundingClientRect(),c0=cellEls[0].getBoundingClientRect(),c1=cellEls[1].getBoundingClientRect(),cw=cellEls[S.W].getBoundingClientRect();
  const ox=c0.left+c0.width/2,oy=c0.top+c0.height/2,sx=c1.left-c0.left,sy=cw.top-c0.top;
  const P=(i,k)=>[ox+i*sx,oy+k*sy],st=[a.left+a.width/2,a.top+a.height/2];
  const cx=Math.max(0,Math.min(S.W-1,Math.round((st[0]-ox)/sx)));
  const cells=route(cx,x,y)||[];
  const pts=[st,...cells.map(([i,k])=>P(i,k)),P(x,y)];
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=cum[cum.length-1]||1;
  const e=document.createElement('div');e.className='ant';e.style.background=CUR[c];e.style.left=st[0]+'px';e.style.top=st[1]+'px';
  $('ants').appendChild(e);
  const frames=pts.map((p,i)=>({transform:`translate(${p[0]-st[0]}px,${p[1]-st[1]}px)`,offset:cum[i]/total}));
  const an=e.animate(frames,{duration:total/SPEED,delay:j*220,easing:'linear',fill:'both'});
  an.onfinish=()=>{
    e.remove();S.g[y][x]=null;S.res.delete(y*S.W+x);S.ants--;S.left--;
    const cell=cellEls[y*S.W+x];cell.style.background='';cell.className='';
    if(!S.over)dispatch();
  };
}
function check(){
  if(S.over||S.ants>0)return;
  if(S.left<=0)return end(true);
  if(!(S.slots.includes(null)&&S.cols.some(c=>c.length)))end(false);
}
function end(win){
  S.over=true;const n=cat.levels.length;
  if(win){PROG.done[cat.id]=Math.max(doneOf(cat),idx+1);saveProg()}
  const next=win&&idx+1<n;
  $('msg').textContent=win?"Все з'їдено! 🎉":'Слоти забиті 😵';
  $('sub2').textContent=win?(next?'':'Категорію пройдено!'):'Спробуй іншу послідовність.';
  $('act').textContent=win?(next?'Далі':'До меню'):'Ще раз';
  $('act').onclick=()=>{$('ov').style.display='none';win?(next?playLevel(cat,idx+1):goHome()):playLevel(cat,idx)};
  $('ov').style.display='flex';
}

// ---- меню, каталог, рівні ----
const show=id=>document.querySelectorAll('.screen').forEach(e=>{if(e.parentElement===document.body)e.classList.toggle('on',e.id===id)});
const doneOf=c=>Math.min(PROG.done[c.id]||0,c.levels.length);
const curCat=()=>CATS.find(c=>c.id===PROG.cat&&c.levels.length)||CATS.find(c=>c.levels.length);
const conv=d=>{const pal={};d.palette.forEach((h,i)=>pal[String.fromCharCode(97+i)]=h);
  return{pal,map:d.pixels.map(r=>r.map(v=>v<0?'.':String.fromCharCode(97+v)).join(''))}};
async function fetchLevel(c,i){
  const k=c.id+i;
  if(!CACHE[k]){const m=c.levels[i],d=await(await fetch('levels/'+m.file)).json();
    CACHE[k]={...DIFF[m.difficulty||'easy'],...conv(d),seed:i*7+c.id.length}}
  return CACHE[k];
}
async function playLevel(c,i){
  try{const L=await fetchLevel(c,i);cat=c;idx=i;PROG.cat=c.id;saveProg();show('game');startGame(L)}
  catch(e){alert('Не вдалося завантажити рівень')}
}
function goHome(){if(S)S.over=true;$('ants').innerHTML='';$('ov').style.display='none';renderHome();show('home')}
function renderHome(){
  const c=curCat(),n=c.levels.length,d=doneOf(c);
  $('hcat').textContent=c.emoji+' '+c.name;
  $('hnum').textContent=d>=n?n:d+1;
  $('hsub').textContent=d>=n?'категорію пройдено ✓':`рівень із ${n}`;
}
function renderCatalog(){
  const el=$('cats');el.innerHTML='';
  CATS.forEach(c=>{const n=c.levels.length,d=doneOf(c),b=document.createElement('button');
    b.className='card'+(n?'':' soon');
    b.innerHTML=`<span class="em">${c.emoji}</span><span class="ct"><b>${c.name}</b><i><u style="width:${n?d/n*100:0}%"></u></i></span><span>${n?d+'/'+n:'скоро'}</span>`;
    if(n)b.onclick=()=>openCat(c);el.appendChild(b)});
}
function openCat(c){
  $('cpt').textContent=c.emoji+' '+c.name;const el=$('lvls'),d=doneOf(c);el.innerHTML='';
  c.levels.forEach((_,i)=>{const b=document.createElement('button');
    b.className='lv'+(i<d?' done':i===d?' cur':' lock');b.textContent=i<=d?i+1:'🔒';
    if(i<=d)b.onclick=()=>playLevel(c,i);el.appendChild(b)});
  show('catpage');
}
$('play').onclick=()=>{const c=curCat();playLevel(c,Math.min(doneOf(c),c.levels.length-1))};
$('tocat').onclick=()=>{renderCatalog();show('catalog')};
$('b1').onclick=goHome;$('b2').onclick=()=>{renderCatalog();show('catalog')};
$('gback').onclick=goHome;$('act2').onclick=goHome;
$('restart').onclick=()=>playLevel(cat,idx);
(async()=>{
  try{CATS=await(await fetch('levels/index.json')).json()}
  catch(e){document.body.textContent='Не вдалося завантажити рівні';return}
  await loadProg();renderHome();show('home');
})();
</script>
</body>
</html>
